<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Standard Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link rel="icon" href="/icons/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Water Tracker - Stay hydrated and healthy, even offline."
    />

    <!-- ── iOS PWA Meta Tags ──────────────────────────────────────── -->
    <!-- black-translucent lets content render behind the status bar -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- App name shown under the icon on the iOS home screen -->
    <meta name="apple-mobile-web-app-title" content="Water Tracker" />
    <!-- iOS home screen icon (must be 180×180) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- ─────────────────────────────────────────────────────────── -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Water Tracker - Stay Hydrated</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
